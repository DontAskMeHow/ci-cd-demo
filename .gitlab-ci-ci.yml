stages:
  - build
  - test
  - publish
  - release    # ← Авто-создание релиза после publish

# ============================================================================
# BUILD
# ============================================================================
build:
  stage: build
  when: manual
  image: docker:24.0.7
  tags: [ci]
  services: [docker:24.0.7-dind]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - |
      if [ -f VERSION ]; then
        export IMAGE_TAG=$(cat VERSION | tr -d '\n\r')
      else
        export IMAGE_TAG="${CI_COMMIT_SHORT_SHA}"
      fi
      echo "🔨 Building with IMAGE_TAG = $IMAGE_TAG"
      docker info
      docker build -t ${IMAGE_PATH}/backend:${IMAGE_TAG} ./backend
      docker build -t ${IMAGE_PATH}/nginx:${IMAGE_TAG} ./nginx
      mkdir -p images
      docker save -o images/backend.tar ${IMAGE_PATH}/backend:${IMAGE_TAG}
      docker save -o images/nginx.tar ${IMAGE_PATH}/nginx:${IMAGE_TAG}
      echo -n ${IMAGE_TAG} > IMAGE_TAG.txt
  script:
    - echo "✅ Build completed"
  artifacts:
    paths:
      - images/
      - IMAGE_TAG.txt
      - docker-compose.yml
      - test.py
    expire_in: 1 hour

# ============================================================================
# TEST
# ============================================================================
test:
  stage: test
  image: docker:24.0.7
  tags: [ci]
  services: [docker:24.0.7-dind]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TEST_NAME: ""
    TEST_PORT: "8080"
  needs:
    - job: build
      artifacts: true
  before_script:
    - |
      export IMAGE_TAG=$(cat IMAGE_TAG.txt 2>/dev/null || echo $CI_COMMIT_SHORT_SHA)
      echo "🔍 Loading images with IMAGE_TAG=${IMAGE_TAG}"
      docker load -i images/backend.tar
      docker load -i images/nginx.tar
      
      # 🔍 Показываем загруженные образы
      docker images | grep ci-cd-demo
      
      # Заменяем порт в docker-compose
      sed -i 's/"80:80"/"'${TEST_PORT}':80"/g' docker-compose.yml
      export COMPOSE_PROJECT_NAME="ci-test-${CI_PIPELINE_ID}-${CI_JOB_ID}"
      
      # 🔍 Показываем финальный docker-compose.yml
      echo "📄 docker-compose.yml:"
      cat docker-compose.yml
      
      # Запускаем контейнеры
      docker compose up -d
      
      # 🔍 Ждём готовности с проверкой статуса
      echo "⏳ Waiting for containers to be healthy..."
      for i in {1..30}; do
        echo "  Attempt $i/30:"
        docker compose ps -a  # показываем ВСЕ контейнеры, даже exited
        if docker compose ps --format "{{.Status}}" 2>/dev/null | grep -q "Up"; then
          echo "✅ Containers are Up!"
          break
        fi
        if [ $i -eq 30 ]; then
          echo "❌ Containers failed to start after 30 attempts"
          docker compose logs backend nginx  # показываем логи перед падением
          exit 1
        fi
        sleep 5
      done
  
  script:
     # 🔥 Показываем логи бэкенда ПЕРЕД проверкой — сразу увидим ошибку!
    - |
      echo "📋 Backend startup logs:"
      docker compose logs backend --tail=100
    
    # Проверка статуса
    - |
      if ! docker compose ps --format "{{.Status}}" | grep -q "Up"; then
        echo "❌ Backend exited with error — see logs above"
        exit 1
      fi
    
    # Запуск тестов
    - |
      BACKEND_CONTAINER=$(docker compose ps -q backend)
      if [ -z "$BACKEND_CONTAINER" ]; then
        echo "❌ Backend container not found!"
        docker compose ps -a
        exit 1
      fi
      echo "✅ Backend container: ${BACKEND_CONTAINER}"
      
      docker cp test.py ${BACKEND_CONTAINER}:/tmp/test.py
      
      if [ -n "$TEST_NAME" ]; then
        docker exec -e TEST_URL="http://localhost:8000" ${BACKEND_CONTAINER} python /tmp/test.py --test "$TEST_NAME"
      else
        docker exec -e TEST_URL="http://localhost:8000" ${BACKEND_CONTAINER} python /tmp/test.py
      fi
  
  after_script:
    # 🔍 Сохраняем логи даже при успехе (для отладки)
    - |
      echo "📋 Saving compose logs..."
      docker compose logs backend nginx > compose-logs.txt 2>&1 || true
    - docker compose down -v || true
    # Артефакт с логами (если нужно)
  artifacts:
    paths:
      - compose-logs.txt
    when: always  # сохраняем даже при падении
    expire_in: 1 day

# ============================================================================
# 📦 PUBLISH: Задаём версии приложений и релиза вручную (в UI)
# ============================================================================
publish:
  stage: publish
  when: manual
  image: docker:24.0.7
  tags: [ci]
  services: [docker:24.0.7-dind]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    # 👇 Эти 3 переменные задаются ТОЛЬКО здесь, через UI "Run with variables"
    BACKEND_VERSION: "3.0"   # обязательно: версия backend, например "2.5.0"
    NGINX_VERSION: "3.0"     # обязательно: версия nginx, например "1.3.0"
    RELEASE_TAG: "v0.0.7"       # обязательно: тег релиза, например "v0.0.2"
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
    - when: never
  before_script:
    # 🔹 Валидация: версии должны быть заданы
    - |
      if [ -z "${BACKEND_VERSION}" ] || [ -z "${NGINX_VERSION}" ] || [ -z "${RELEASE_TAG}" ]; then
        echo "❌ ERROR: BACKEND_VERSION, NGINX_VERSION и RELEASE_TAG обязательны!"
        echo "💡 При запуске нажмите ▼ → 'Run with variables' и укажите:"
        echo "   • BACKEND_VERSION=4.0"
        echo "   • NGINX_VERSION=4.0"
        echo "   • RELEASE_TAG=v0.0.6"
        exit 1
      fi
      
      echo "📦 Publishing:"
      echo "   • backend: ${BACKEND_VERSION}"
      echo "   • nginx: ${NGINX_VERSION}"
      echo "   • Release: ${RELEASE_TAG}"
      echo "   • Registry: ${NEXUS_REGISTRY}/${IMAGE_PATH}"
    
    - echo "${NEXUS_PASSWORD}" | docker login ${NEXUS_REGISTRY} -u "${NEXUS_USER}" --password-stdin
    
    # 🔍 Проверка директорий
    - |
      for app in backend nginx; do
        [ -f "${app}/Dockerfile" ] || { echo "❌ ${app}/Dockerfile not found"; exit 1; }
      done
    
    # Собираем образы с указанными версиями
    - docker build -t ${NEXUS_REGISTRY}/${IMAGE_PATH}/backend:${BACKEND_VERSION} ./backend
    - docker build -t ${NEXUS_REGISTRY}/${IMAGE_PATH}/nginx:${NGINX_VERSION} ./nginx
    
    # Добавляем latest для main
    - |
      if [ "${CI_COMMIT_BRANCH}" = "main" ]; then
        docker tag ${NEXUS_REGISTRY}/${IMAGE_PATH}/backend:${BACKEND_VERSION} ${NEXUS_REGISTRY}/${IMAGE_PATH}/backend:latest
        docker tag ${NEXUS_REGISTRY}/${IMAGE_PATH}/nginx:${NGINX_VERSION} ${NEXUS_REGISTRY}/${IMAGE_PATH}/nginx:latest
      fi
  
  script:
    # Пушим образы в Nexus
    - docker push ${NEXUS_REGISTRY}/${IMAGE_PATH}/backend:${BACKEND_VERSION}
    - docker push ${NEXUS_REGISTRY}/${IMAGE_PATH}/nginx:${NGINX_VERSION}
    - |
      if [ "${CI_COMMIT_BRANCH}" = "main" ]; then
        docker push ${NEXUS_REGISTRY}/${IMAGE_PATH}/backend:latest
        docker push ${NEXUS_REGISTRY}/${IMAGE_PATH}/nginx:latest
      fi
    
    # 🔹 Сохраняем конфиг для auto_release (через dotenv-артефакт)
    - |
      echo "BACKEND_VERSION=${BACKEND_VERSION}" > release-versions.env
      echo "NGINX_VERSION=${NGINX_VERSION}" >> release-versions.env
      echo "RELEASE_TAG=${RELEASE_TAG}" >> release-versions.env
      echo "📄 Generated release-versions.env:"
      cat release-versions.env
  
  artifacts:
    paths:
      - release-versions.env
    expire_in: 1 hour
    reports:
      dotenv: release-versions.env  # 👈 автоматически экспортирует переменные в auto_release!

# ============================================================================
# 🏷️ AUTO-RELEASE: Создаёт релиз с конфигом версий после успешного publish
# ============================================================================
auto_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:v0.22.0
  needs:
    - job: publish
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
    - when: never
  before_script:
    - |
      echo "🏷️ Creating release: ${RELEASE_TAG}"
      echo "📦 Versions: backend=${BACKEND_VERSION}, nginx=${NGINX_VERSION}"
      
      # 🔹 1. Проверяем, что файл уже есть в этом коммите
      if ! git show "${CI_COMMIT_SHA}:releases/${RELEASE_TAG}.yml" >/dev/null 2>&1; then
        echo "❌ ERROR: File releases/${RELEASE_TAG}.yml not found in commit ${CI_COMMIT_SHA}"
        echo "💡 Create it manually, commit to main, then run publish"
        exit 1
      fi
      echo "✅ File releases/${RELEASE_TAG}.yml found"
      
      # 🔹 2. Git config
      git config user.name "gitlab-ci"
      git config user.email "gitlab-ci@${CI_PROJECT_PATH}"
      
      # 🔹 3. Авторизация через HTTP + CI_JOB_TOKEN (обходит TLS/SSH ошибки)
      SERVER_HOST="${CI_SERVER_URL#*://}"
      git remote set-url origin http://oauth2:${GITLAB_TOKEN}@${SERVER_HOST}/${CI_PROJECT_PATH}.git

  script:
  - |
    echo "🔍 Tag will point to commit: ${CI_COMMIT_SHA}"
    
    # ✅ Проверяем, что файл реально есть в этом коммите
    git show "${CI_COMMIT_SHA}:releases/${RELEASE_TAG}.yml" >/dev/null 2>&1 || {
      echo "❌ ERROR: File releases/${RELEASE_TAG}.yml NOT in commit ${CI_COMMIT_SHA}"
      exit 1
    }

    # 🔹 Удаляем старый тег (если был)
    git tag -d "${RELEASE_TAG}" 2>/dev/null || true
    git push origin --delete "${RELEASE_TAG}" 2>/dev/null || true

    # 🔹 Создаём тег ЧЁТКО на нужном коммите
    git tag -a "${RELEASE_TAG}" "${CI_COMMIT_SHA}" -m "Auto-release ${RELEASE_TAG}"
    git push origin "${RELEASE_TAG}" --force

    echo "✅ Tag ${RELEASE_TAG} pushed on ${CI_COMMIT_SHA}"

    # 🔹 Создаём Release
    release-cli create \
      --name "Release ${RELEASE_TAG}" \
      --tag-name "${RELEASE_TAG}" \
      --description "Release ${RELEASE_TAG} | Deploy: ${CI_PROJECT_URL}/-/pipelines?ref=${RELEASE_TAG}&scope=tags | Versions: backend=${BACKEND_VERSION}, nginx=${NGINX_VERSION}" \
      --ref "${CI_COMMIT_SHA}" \
      --assets-link "{\"name\":\"Config\",\"url\":\"${CI_PROJECT_URL}/-/blob/${CI_COMMIT_SHA}/releases/${RELEASE_TAG}.yml\"}"

  artifacts:
    paths:
      - releases/*.yml
    expire_in: 1 year
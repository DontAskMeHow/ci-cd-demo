# ============================================================================
# КОРНЕВОЙ .gitlab-ci.yml (Оркестратор)
# ============================================================================
workflow:
  rules:
    # ✅ Гарантируем создание пайплайнов для ветки main и для тегов
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - when: never

variables:
  NEXUS_REGISTRY: "registry.example.com"
  IMAGE_PATH: "ci-cd-demo"
  IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"
  TEST_PORT: "8080"

cache:
  paths: [.docker-cache/]

stages:
  - trigger-ci
  - trigger-cd

# 🔹 CI-Триггер: запускается и с main, и с тега
trigger-ci:
  stage: trigger-ci
  trigger:
    include: .gitlab-ci-ci.yml
  inherit:
    variables: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - backend/**/*
        - nginx/**/*
        - docker-compose.yml
        - .gitlab-ci-ci.yml
      when: always
    - if: $CI_COMMIT_TAG
      when: always
    - when: manual
      allow_failure: true

# 🔹 CD-Триггер: появляется ТОЛЬКО в пайплайнах по тегу
trigger-cd:
  stage: trigger-cd
  trigger:
    include: .gitlab-ci-cd.yml
  inherit:
    variables: true
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    - when: never